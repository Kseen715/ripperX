<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ripperX - Sign in</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* Same grayscale-with-one-accent chrome as the main page, cut down to
     what one form needs. */
  :root {
    --bg: #eeeeee; --panel: #fafafa; --ink: #111111; --ink-2: #444444;
    --muted: #767676; --line: #111111; --hair: #c4c4c4; --grid: #dcdcdc;
    --accent: #b3122c; --accent-ink: #ffffff; --chamfer: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0e; --panel: #181818; --ink: #ededed; --ink-2: #bdbdbd;
      --muted: #8a8a8a; --line: #ededed; --hair: #3a3a3a; --grid: #1d1d1d;
      --accent: #e01e3c; --accent-ink: #0e0e0e;
    }
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 28px 16px; background: var(--bg); color: var(--ink);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 72px 72px, 72px 72px;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card { width: 100%; max-width: 360px; }
  header {
    border: 1px solid var(--line); background: var(--panel);
    padding: 14px 16px; margin-bottom: 16px;
  }
  h1 {
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    margin: 0 0 6px; font-weight: 700;
  }
  header p { margin: 0; color: var(--ink-2); font-size: 12px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); padding: 14px;
    position: relative;
  }
  /* 45-degree chamfer on two opposing corners, as on the main page. */
  .cut::before, .cut::after {
    content: ""; position: absolute; width: var(--chamfer); height: var(--chamfer);
    pointer-events: none;
  }
  .cut::before {
    top: -1px; left: -1px;
    background: linear-gradient(to bottom right,
      var(--bg) calc(50% - .5px), var(--line) calc(50% - .5px) calc(50% + .5px),
      var(--panel) calc(50% + .5px));
  }
  .cut::after {
    bottom: -1px; right: -1px;
    background: linear-gradient(to top left,
      var(--bg) calc(50% - .5px), var(--line) calc(50% - .5px) calc(50% + .5px),
      var(--panel) calc(50% + .5px));
  }
  .label {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px; font-weight: 700; display: block;
  }
  input, button {
    font: inherit; font-size: 13px; padding: 9px 13px; width: 100%;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  }
  input { margin-bottom: 14px; min-height: 44px; }
  button {
    cursor: pointer; position: relative; min-height: 44px;
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    font-weight: 700; letter-spacing: .04em;
  }
  button::after {
    content: ""; position: absolute; top: 0; right: 0; width: 7px; height: 7px;
    background: linear-gradient(to bottom left, currentColor 0 50%, transparent 50%);
    opacity: .5;
  }
  button:hover:not(:disabled) { filter: brightness(1.18); }
  button:disabled { background: var(--panel); color: var(--muted); border-color: var(--hair); cursor: not-allowed; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .err {
    padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line);
    border-left: 5px solid var(--ink); background: var(--bg); font-size: 13px;
  }
  .foot { font-size: 11px; color: var(--muted); margin: 14px 0 0; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>ripperX</h1>
    <p data-i18n="login.subtitle">Sign in to use the drives.</p>
  </header>

  <form class="panel cut" id="form">
    <div class="err" id="error" hidden></div>
    <label class="label" for="user" data-i18n="login.user">User</label>
    <input id="user" name="user" autocomplete="username" autocapitalize="none"
           autocorrect="off" spellcheck="false" required autofocus>
    <label class="label" for="password" data-i18n="login.password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
    <button id="submit" type="submit" data-i18n="login.go">Sign in</button>
    <p class="foot" data-i18n="login.foot">
      This browser stays signed in until you sign out.
    </p>
  </form>
</div>
<script src="i18n.js"></script>
<script>
'use strict';

const el = (id) => document.getElementById(id);

// The words come from the same locale files the main page uses, so a server
// set to another language asks for a password in it.
i18n.start();

el('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  el('error').hidden = true;
  el('submit').disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: el('user').value, password: el('password').value }),
    });
    if (!r.ok) {
      let msg = t('error.http', { status: r.status });
      try { msg = (await r.json()).error || msg; } catch (e) {}
      el('error').textContent = msg;
      el('error').hidden = false;
      el('password').value = '';
      el('password').focus();
      return;
    }
    // The tokens arrive as cookies; nothing is kept in page storage.
    window.location.replace('/');
  } catch (e) {
    el('error').textContent = String(e);
    el('error').hidden = false;
  } finally {
    el('submit').disabled = false;
  }
});
</script>
</body>
</html>
