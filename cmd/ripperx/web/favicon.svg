<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A disc: the outer edge and the centre hole in the same grey as the app
       chrome, with the read stripe in the accent. Stroke colours are fixed
       rather than currentColor - a favicon is rendered outside the page, so
       #8a8a8a is picked to read on both a light and a dark browser tab. -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <circle cx="16" cy="16" r="4" fill="none" stroke="#8a8a8a" stroke-width="2.5"/>
  <!-- The laser's track, cut as an arc so the disc reads as spinning rather
       than as a ring. -->
  <path d="M16 6.5 A9.5 9.5 0 0 1 25.5 16"
        fill="none" stroke="#e01e3c" stroke-width="3" stroke-linecap="round"/>
</svg>
