# ripperX settings. Install as /etc/ripperx.conf, or pass -config.
#
# Every setting here is also a command-line flag, and an argument on the
# command line always wins. The exceptions are the three passwords at the
# bottom: they have no flag, because an argument is readable by every user on
# the machine through /proc.
#
# Only a line whose first non-blank character is # is a comment. Values run
# to the end of the line, so a password may contain a # without escaping it.
#
# If this file holds any of the secrets, ripperX refuses to start unless it
# is mode 600:
#
#     chmod 600 /etc/ripperx.conf

# Where to listen. Bind to 127.0.0.1 and put a reverse proxy in front of it
# if this machine is reachable from outside your network.
addr = 0.0.0.0:8080

# Where rips are written and burns are read from. One flat directory.
out = /var/lib/ripperx

# The language the page is shown in unless a browser asks for another, and
# the fallback for anything a translation has no words for yet. It has to be
# one of the locale files the build carries; ripperX lists them at startup
# and refuses to start on a name it does not have.
# lang = en

# Where an image is copied to before it is burned, when the images live on a
# share. Empty puts it beside the images when those are local, and falls back
# to the system temporary directory otherwise - which on a systemd machine is
# usually a tmpfs, so a dual-layer image would be staged into RAM. Point this
# at a real directory whenever the images are remote.
# stage-dir = /var/lib/ripperx/staging

# Where surface scans and finished jobs are recorded, so they survive a
# restart. Empty puts it beside the images when those are local, and in the
# working directory when they are on a share - a SQLite file on SMB is a
# good way to corrupt one, so set this explicitly when the images are
# remote. "off" turns the history off entirely.
# history = /var/lib/ripperx/ripperx.db

# Which drives to offer. Empty finds every /dev/sr*, which is normally right;
# name them explicitly to offer only some of the drives in a machine.
# devices = /dev/sr0,/dev/sr1

# Cap the read speed of every rip, in kilobytes a second. 0 leaves the drive
# alone. 176 is 1x on a CD, 2822 is 16x. Slowing a drive down is the single
# most effective thing for a scratched disc: at 4x the servo tracks damage
# that it skates straight over at 48x.
# read-speed-kb = 0

# The program that writes discs. Empty looks for xorriso, then cdrecord, then
# wodim. ripperX never writes to a disc itself.
# burner =

# Turn burning off entirely. The right setting for a machine whose drives are
# shared out read-only: the endpoints then refuse rather than depending on
# nobody pressing the button.
# allow-burn = true

# Let the page open and close the trays.
# allow-eject = true

# The largest image that may be uploaded to be burned.
# upload-max = 8589934592

# Keep images on an SMB share instead of a local directory. ripperX speaks SMB
# itself, so this needs no cifs-utils, no mount unit and no root.
# smb-address = //nas.lan/media/discs
# smb-user = ripperx
# smb-domain = WORKGROUP

# A second, read-only library of images to burn from - usually a folder of
# installer ISOs that something else maintains. Nothing is ever written to it:
# the refusal is structural rather than a convention, so no amount of
# misdirected requests can delete what is in it. It may be an SMB path or a
# local directory.
#
# It uses smb-user, smb-password and smb-domain unless given its own below.
# iso-store = //nas.lan/pve/template/iso
# iso-store-user = someone-else
# iso-store-domain = WORKGROUP

# Require a login. Both of these must be set, or neither; with neither,
# anyone who can reach the port can use the drives.
# auth-user = ripper

# How long a token lasts before it is renewed from the refresh token, and how
# long a browser stays signed in without typing the password again.
# auth-ttl = 15m
# auth-refresh-ttl = 8760h

# --- settings with no command-line flag ---

# The password for auth-user.
# auth-password = change me

# The password for smb-user.
# smb-password = change me too

# The password for iso-store-user, when the library has its own account.
# iso-store-password = change me as well

# The key logins are signed with, as at least 64 hex characters. Leave it
# unset and ripperX picks a random one at startup, which means everyone is
# signed out when it restarts. Set it to keep sessions across restarts:
#
#     head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'
#
# jwt-secret =
